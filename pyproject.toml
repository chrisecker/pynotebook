[tool.poetry]
name = "pynotebook"
version = "0.4.1"
description = "A wxPython based notebook environment for interactive computing."
authors = ["C. Ecker <textmodelview@gmail.com>"]
readme = "README.md"
packages = [{include = "pynotebook"}]
exclude = [
    "pynotebook/**/__pycache__",
    "pynotebook/**/*.pyc",
    "pynotebook/**/*.pyo",
    "pynotebook/**/*.py~",
    "pynotebook/**/*.swp",
    "pynotebook/**/*~",
    "pynotebook/**/.#*",
    "pynotebook/**/*.pdf",
    "pynotebook/wxtextview/ecker@*"
]


[tool.poetry.dependencies]
python = "^3.10"
wxPython = {version = ">=4.2", optional = true}
cerealizer = ">=0.8"

# wxPython is optional: on Linux pip has to build it, the one of the
# distribution or of the application is usually preferred
[tool.poetry.extras]
wx = ["wxPython"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

