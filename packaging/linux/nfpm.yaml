# Linux packages (.deb, .rpm), built by the job "linux" in
# .github/workflows/release.yml. Pure Python, so one package for all
# architectures; pynotebook and cerealizer are included, wxPython comes
# from the distribution (no slow pip build).

name: pnb
arch: all
platform: linux
version: ${VERSION}
section: devel
priority: optional
maintainer: Christof Ecker <textmodelview@gmail.com>
description: |
  Lightweight notebook interface for the Python interpreter.
  pnb combines Python code, rich text and graphics in one document,
  with syntax highlighting, completion and plotting via matplotlib.
homepage: https://codeberg.org/chrisecker/pynotebook
license: BSD-3-Clause

contents:
  - src: ./build/linux/stage
    dst: /usr/share/pnb
    type: tree
  - src: ./packaging/linux/pnb
    dst: /usr/bin/pnb
    file_info:
      mode: 0755
  - src: ./pnb/pnb.desktop
    dst: /usr/share/applications/pnb.desktop
  - src: ./packaging/linux/pnb.xml
    dst: /usr/share/mime/packages/pnb.xml
  - src: ./pnb/pnb.png
    dst: /usr/share/icons/hicolor/96x96/apps/pnb.png
  # not in /usr/share/doc: minimal systems (e.g. Ubuntu images) omit it
  - src: ./pnb/demo/*.pnb
    dst: /usr/share/pnb/examples/
  - src: ./LICENSE
    dst: /usr/share/doc/pnb/LICENSE

# menu, file type and icon caches: updated by the distribution's triggers

overrides:
  deb:
    depends:
      - python3 (>= 3.10)
      - python3-wxgtk4.0 (>= 4.2)
  rpm:
    depends:
      - python3 >= 3.10
      - python3-wxpython4 >= 4.2
